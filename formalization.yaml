version: "v0.4"

project:
  name: "Chess in Lean 4"
  description: >-
    A standalone Lean 4 reimplementation of orthodox-chess move rules over
    generalized total finite position records. It formalizes a finite board
    model, geometric attacks, special moves, check and legal-move semantics,
    an exhaustive verified move generator, histories and draw policies,
    FEN/UCI/SAN interfaces, perft regressions, symmetry, and a recursively
    checked mate-in-two certificate. The selected certificate-adequacy theorem
    proves soundness and completeness of finite alternating mate certificates
    for an explicit terminal policy; standard orthodox positions are checked
    concrete instances of this broader semantic domain.
  authors:
    - "Arthur Freitas Ramos"
    - "David Barros Hulak"
    - "Ruy J. G. B. de Queiroz"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Arthur Freitas Ramos"
    - "David Barros Hulak"
    - "Ruy J. G. B. de Queiroz"

classification:
  arxiv: ["cs.LO"]
  msc2020: ["03B35"]

sources:
  - title: "FIDE Laws of Chess"
    authors:
      - "FIDE"
    id: "https://handbook.fide.com/chapter/e012023"
    type: "other"
    relationship: "adapts"
    note: >-
      The rule kernel follows the orthodox baseline in the FIDE Laws of Chess
      effective 1 January 2023. The selected Lean theorem is a finite
      certificate-adequacy result over the generalized total finite record
      model, not a characterization of which records are FIDE-legal positions.

related_formalizations:
  - id: "https://github.com/Arthur742Ramos/isabelle-afp-monorepo"
    relationship: "adapts"
    revision: "a81eecf7b7a77064380bdf1f8915d73ee9955fa3"
    project_path: "projects/chess-isabelle"
    artifact_path: "artifacts/isabelle/chess-isabelle"
    location: "https://github.com/Arthur742Ramos/chess-lean/tree/2b8cc5e90949fdd103f3a8d6d7ac79d122d9caaf/artifacts/isabelle/chess-isabelle"
    note: >-
      Prior Isabelle/HOL formalization adapted by this Lean reimplementation.
      It originated in the private repository Arthur742Ramos/isabelle-afp-monorepo
      at immutable revision a81eecf7b7a77064380bdf1f8915d73ee9955fa3 and the
      commit-relative project path projects/chess-isabelle. A complete public
      snapshot is committed at the location above, so review does not depend
      on access to the upstream repository. The Lean development is standalone
      and does not depend on Isabelle at build time.

status:
  scope: >-
    The proved Lean scope covers generalized total finite position records and
    transitions, including potentially malformed or unreachable records;
    attacks, check, pseudo-legal and legal moves, all standard special moves,
    exhaustive finite move generation, histories and reachability predicates,
    repetition and FIDE clock predicates, bounded forced mate, finite mate
    certificates, typed and strict textual FEN, UCI, canonical SAN, perft,
    rank-reflection symmetry, concrete standard perft regressions, and the
    Isabelle mate-in-two witness. The capstone theorem advertises
    `Chess.mateCertificate_rules_adequate`: a sound-and-complete finite
    certificate language for bounded forced mate with an explicit terminal
    policy. The full-rule `Chess.legalMoves_correct` generator correspondence
    is a proved internal foundation, and the concrete result families are
    checked separately.
    `positionInvariant` is available as a structural safety predicate, but it
    is not a hypothesis of the selected theorem and is not a characterization
    of reachability. The Challenge and Solution expose the complete production
    move/state core, including castling and en passant. This is a faithful
    standalone reimplementation rather than a line-by-line translation: not
    every theorem name or generic proof inventory in the Isabelle entry is
    duplicated, and the exact unbounded dead-position predicate remains a
    logical definition separate from executable policy evaluation.
  # Counts cover the completed proof development; Challenge.lean's deliberate
  # comparison hole is excluded.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models: ["GPT-5"]
      framework: "Lean 4 and Mathlib"
      tool_setup: >-
        AI-assisted proof engineering with incremental Lean compilation,
        native_decide regression checks, explicit source audits, and the
        pinned Palomar template validation workflow.
      cost:
        wall_time: "not tracked"
        spend_usd: "subscription-based"
        hardware: "local macOS workstation"
      prompting_notes: >-
        Iterative requests to port the Isabelle chess semantics, preserve
        executable and logical layers, and validate the resulting repository
        independently.
    - method: "manual"
      models: []
      framework: "Lean 4 and Mathlib"
      tool_setup: "Human-authored source decisions, attribution, and scope review"
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
        hardware: "local workstation"
      prompting_notes: "n/a"
  spend_usd: "subscription-based"
  notes: >-
    The Isabelle source entry was inspected before the Lean port. Definitions
    were implemented in small modules, each touched module was compiled, and
    concrete rule and perft examples were checked by Lean's native evaluator.

fidelity:
  divergences: >-
    The Lean implementation preserves the modeled orthodox-rule state and
    rule scope but reorganizes the thirty Isabelle theories into cohesive Lean
    modules. It uses Boolean evaluators for executable checking and proposition
    wrappers for exact logical statements. The selected certificate-adequacy
    theorem is intentionally stated over generalized Position records and an
    explicit terminal policy; it does not assume `positionInvariant` or
    reachability and therefore does not claim that every represented record is
    an orthodox legal position. The current port proves the finite rule-level
    certificate soundness/completeness result and separately exposes the
    history-aware checker; it does not claim one-for-one Lean counterparts for
    every Isabelle invariant-preservation or symmetry transport lemma.

review:
  status: "self-assessed with clean-build and independent-comparator checks"
  reviewers:
    - "Arthur Freitas Ramos"
    - "David Barros Hulak"
    - "Ruy J. G. B. de Queiroz"
  notes: >-
    Review covers source-to-module alignment, executable special-move cases,
    standard perft values, parser/printer boundaries, both soundness and
    constructive certificate completeness, metadata, pinned manifests, and
    Palomar structural checks.
    The formalization should still receive Palomar's normal editorial and
    independent mathematical review after intake.

alignment:
  namespace: "Chess"
  statements:
    - source: "Lean rule-kernel extension: finite mate-certificate adequacy"
      lean: "Chess.mateCertificate_rules_adequate"
      module: "Chess/Certificates.lean; Challenge.lean / Solution.lean"
      status: "proved"
      note: >-
        For every represented position, attacking colour, finite bound, and
        explicit terminal policy, the rule-level certificate checker accepts
        some finite proof tree exactly when the recursive bounded forced-mate
        semantics holds. This is a new Lean adequacy theorem over the
        FIDE/Isabelle-inspired rule model; no one-to-one Isabelle declaration
        is claimed for this extension.
    - source: "Chess_Move_Generator_Correct.legal_moves_correct"
      lean: "Chess.legalMoves_correct"
      module: "Chess/Generator.lean"
      status: "proved"
      note: >-
        The exhaustive candidate filter is equivalent to declarative legality
        for every represented Position record; no well-formedness or
        reachability hypothesis is assumed.
    - source: "Chess_Move_Generator_Correct.legal_moves_correct"
      lean: "Chess.legalMoves_correct"
      module: "Challenge.lean / Solution.lean"
      status: "proved"
      note: >-
        Full-rule standalone registry surface of the production generator
        theorem over generalized records, including castling, en passant,
        promotion, and king safety. Potentially malformed or unreachable
        records are intentionally in scope.
    - source: "Chess_Mate_Two.mate_two_certificate_checked"
      lean: "Chess.mateTwoCertificate_checked"
      module: "Chess/MateTwo.lean"
      status: "proved by native evaluation"
      note: "The seven-reply, three-ply certificate is accepted by the executable checker."
    - source: "Chess_Mate_Two.mate_two_certificate_checked"
      lean: "Chess.mateTwoCertificate_rules_forced"
      module: "Chess/MateTwo.lean"
      status: "proved from native evaluation and certificate adequacy"
      note: >-
        The concrete seven-reply, three-ply witness is accepted by the
        rule-level checker and therefore establishes the corresponding
        bounded forced-mate proposition.
    - source: "Chess_Perft and Chess_Examples reference counts"
      lean: "Chess.initialPosition_perft_3"
      module: "Chess/Examples.lean"
      status: "proved by native evaluation"
      note: "Initial, Kiwipete, and the third standard perft position are checked at listed depths."

acknowledgements: >-
  Thanks to the Lean and Mathlib communities and to the Palomar Registry
  template authors. The source development follows the FIDE Laws of Chess,
  FEN, UCI, SAN, and standard perft conventions. Authors and source
  contributors are recorded above as requested.
